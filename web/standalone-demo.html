<title>AI Innovators Lab</title>
<style>
  :root { --bg:#0e1016; --panel:#151822; --line:#262b3a; --fg:#e6e8f0; --dim:#8c92a5; --accent:#64cdeb; --good:#6edc82; --bad:#ec5a5a; --gold:#f2d05a; --warn:#f59646;
          --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 var(--mono); }
  main { max-width: 1500px; margin: 0 auto; padding: 12px 16px 24px; display: grid; gap: 10px; }
  canvas { width: 100%; max-width: 100%; height: auto; display: block; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 6px; background: var(--panel); }
  .bar { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px; color: var(--dim); font-size: 12px; }
  .bar b { color: var(--accent); font-weight: 600; }
  .grid { display: grid; grid-template-columns: minmax(200px, 1fr) minmax(0, 2fr) minmax(0, 2fr); gap: 10px; align-items: start; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; }
  h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
  .muted { color: var(--dim); }
  input[type=search] { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; font: inherit; margin-bottom: 8px; }
  .roster { max-height: 420px; overflow: auto; display: grid; gap: 2px; }
  .who { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 4px; cursor: pointer; border: 1px solid transparent; background: none; color: inherit; font: inherit; text-align: left; width: 100%; }
  .who:hover, .who:focus-visible { border-color: var(--line); background: #1b1f2c; outline: none; }
  .who.sel { border-color: var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #444a5c; }
  .dot.on { background: var(--good); } .dot.live { background: var(--accent); }
  .who .r { margin-left: auto; color: var(--dim); font-size: 11px; }
  .role-h { color: var(--dim); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; margin: 6px 0 2px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 0 0 8px; }
  dt { color: var(--dim); } dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .screen { color: var(--good); margin: 0 0 8px; white-space: pre-wrap; }
  pre.term { background: #07090d; border: 1px solid var(--line); border-radius: 4px; padding: 8px; margin: 0; height: 320px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: #cfd6e6; font-size: 12px; }
  .bots { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .bot { border: 1px solid var(--line); border-radius: 6px; padding: 8px; min-width: 0; }
  .bot.win { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
  .bot h3 { margin: 0 0 4px; font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
  .meter { height: 6px; background: #22273a; border-radius: 3px; overflow: hidden; margin: 6px 0; }
  .meter i { display: block; height: 100%; background: var(--good); }
  .intent { color: var(--accent); }
  .hist { margin: 6px 0 0; padding: 0; list-style: none; color: var(--dim); font-size: 11px; max-height: 120px; overflow: auto; }
  .hist li.wrong { color: var(--bad); }
  .banner { padding: 6px 8px; border-radius: 4px; background: #2a2410; color: var(--gold); margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 4px 0 8px; color: var(--dim); font-size: 11px; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<main>
  <canvas id="lab" width="640" height="420" aria-label="Lab live view"></canvas>
  <div class="bar"><span id="mode">loading...</span><span>Click a person (or a name below) to open their work. Hover for names.</span></div>
  <div class="grid">
    <section aria-labelledby="h-team"><h2 id="h-team">Team <span id="count" class="muted"></span></h2>
      <input type="search" id="filter" placeholder="Filter by name, role or model">
      <div id="roster" class="roster"></div>
    </section>
    <section aria-labelledby="h-agent"><h2 id="h-agent">Agent</h2><div id="agent" class="muted">Select someone to see their profile, screen and terminal.</div></section>
    <section aria-labelledby="h-arena"><h2 id="h-arena">Arena</h2><div id="arena" class="muted">No competition yet.</div></section>
  </div>
</main>

<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const cv = $('lab'), ctx = cv.getContext('2d'), modeEl = $('mode');
  const params = new URLSearchParams(location.search);
  const standalone = !!window.LAB_WASM_B64 || params.has('demo') || location.protocol === 'file:';
  const bytes = window.LAB_WASM_B64
    ? Uint8Array.from(atob(window.LAB_WASM_B64), c => c.charCodeAt(0))
    : await (await fetch('lab_web.wasm')).arrayBuffer();
  const { instance } = await WebAssembly.instantiate(bytes, {});
  const ex = instance.exports;
  ex.lab_init(standalone ? 1 : 0, (Math.random() * 1e9) | 0);
  const enc = new TextEncoder(), dec = new TextDecoder();
  const pass = (s, fn) => {
    const b = enc.encode(s), p = ex.lab_alloc(b.length);
    new Uint8Array(ex.memory.buffer, p, b.length).set(b);
    const r = fn(p, b.length); ex.lab_free(p, b.length); return r;
  };
  const send = (s) => { if (!pass(s, ex.lab_ingest)) console.warn('lab: message not understood', s.slice(0, 200)); };
  if (standalone) {
    modeEl.innerHTML = '<b>Standalone demo</b> - sample agents and scripted robots running in your browser (Rust/WASM)';
  } else {
    const es = new EventSource('/api/stream');
    es.onopen = () => { ex.lab_set_connected(1); modeEl.innerHTML = '<b>Live</b> - connected to the lab server'; };
    es.onmessage = (m) => send(m.data);
    es.onerror = () => { ex.lab_set_connected(0); modeEl.textContent = 'Server offline - retrying...'; };
  }
  const toFb = (e) => {
    const r = cv.getBoundingClientRect();
    return [Math.floor((e.clientX - r.left) * cv.width / r.width), Math.floor((e.clientY - r.top) * cv.height / r.height)];
  };
  cv.addEventListener('click', (e) => { ex.lab_click(...toFb(e)); refresh(true); });
  cv.addEventListener('mousemove', (e) => { cv.style.cursor = ex.lab_hover(...toFb(e)) ? 'pointer' : 'default'; });

  let last = performance.now();
  const frame = (now) => {
    const ptr = ex.lab_frame(now - last); last = now;
    const W = ex.lab_width(), H = ex.lab_height();
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    ctx.putImageData(new ImageData(new Uint8ClampedArray(ex.memory.buffer, ptr, W * H * 4), W, H), 0, 0);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);

  // ---- side panels (data comes from the Rust world as JSON) ----
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) { if (k === 'class') n.className = v; else if (k === 'style') n.style.cssText = v; else n.setAttribute(k, v); }
    for (const k of kids) if (k != null) n.append(k.nodeType ? k : String(k));
    return n;
  };
  const ROBOT = ['#cdd6e2','#ff8e3e','#8cdeff','#de7ade','#a2e87a','#fae87a','#b6a2ff','#ff7a7a'];
  const ROLES = ['captain','researcher','scientist','engineer','tester','auditor','scribe','guest'];
  let selected = '', lastTermLen = -1, lastSel = '';
  const select = (id) => { selected = id; pass(id, ex.lab_select); refresh(true); };

  let rosterKey = '';
  function renderRoster(d) {
    const f = $('filter').value.toLowerCase();
    const key = f + '|' + selected + '|' + JSON.stringify(d.agents);
    if (key === rosterKey) return;
    rosterKey = key;
    $('count').textContent = `${d.agents.filter(a => a.online).length}/${d.agents.length} online`;
    const box = $('roster'); box.replaceChildren();
    for (const role of ROLES) {
      const list = d.agents.filter(a => a.role === role && (!f || (a.name + ' ' + a.role + ' ' + a.id).toLowerCase().includes(f)));
      if (!list.length) continue;
      box.append(el('div', { class: 'role-h' }, `${role}s (${list.length})`));
      for (const a of list) {
        const b = el('button', { class: 'who' + (a.id === selected ? ' sel' : ''), type: 'button', title: a.id },
          el('span', { class: 'dot' + (a.live ? ' live' : a.online ? ' on' : '') }), a.name, el('span', { class: 'r' }, a.online ? a.activity : 'offline'));
        b.onclick = () => select(a.id);
        box.append(b);
      }
    }
  }

  function renderAgent(s) {
    const box = $('agent');
    if (!s) { box.className = 'muted'; box.textContent = 'Select someone to see their profile, screen and terminal.'; lastSel = ''; return; }
    const term = s.terminal.join('\n');
    if (s.id !== lastSel || !box.querySelector('pre.term')) {
      box.className = '';
      box.replaceChildren(
        el('dl', {}, el('dt', {}, 'Name'), el('dd', { id: 'a-name' }), el('dt', {}, 'Role'), el('dd', { id: 'a-role' }),
          el('dt', {}, 'Model'), el('dd', { id: 'a-model' }), el('dt', {}, 'Harness'), el('dd', { id: 'a-harness' }),
          el('dt', {}, 'Status'), el('dd', { id: 'a-status' }), el('dt', {}, 'Doing'), el('dd', { id: 'a-task' }), el('dt', {}, 'About'), el('dd', { id: 'a-bio' })),
        el('div', { class: 'role-h' }, 'Screen'), el('pre', { class: 'screen', id: 'a-screen' }),
        el('div', { class: 'role-h' }, 'Terminal'), el('pre', { class: 'term', id: 'a-term', tabindex: '0' }));
      lastSel = s.id; lastTermLen = -1;
    }
    $('a-name').textContent = s.name + '  (' + s.id + ')';
    $('a-role').textContent = s.role;
    $('a-model').textContent = s.model || '-';
    $('a-harness').textContent = s.harness || '-';
    $('a-status').textContent = s.live ? 'live harness' : s.online ? 'online' : 'offline (waiting for first event)';
    $('a-task').textContent = s.activity + (s.task ? ' - ' + s.task : '');
    $('a-bio').textContent = s.bio || '-';
    $('a-screen').textContent = s.screen.length ? s.screen.join('\n') : '(nothing on screen)';
    const t = $('a-term');
    if (term.length !== lastTermLen) {
      const atBottom = t.scrollTop + t.clientHeight >= t.scrollHeight - 8;
      t.textContent = term || '(no terminal output yet: send "output" events or pipe through "labctl tee")';
      if (atBottom || lastTermLen === -1) t.scrollTop = t.scrollHeight;
      lastTermLen = term.length;
    }
  }

  function renderArena(a) {
    const box = $('arena');
    if (!a.robots.length) { box.className = 'muted'; box.textContent = 'No competition yet. Send an arena_start event to begin one.'; return; }
    box.className = '';
    const kids = [];
    const winner = !a.running && a.robots.find(r => r.rank === 0);
    if (winner) kids.push(el('div', { class: 'banner' }, `Winner: ${winner.name}` + (a.note ? ` - ${a.note}` : '')));
    kids.push(el('div', {}, el('b', {}, a.title), el('span', { class: 'muted' }, `  match ${a.match} - ${a.running ? 'running' : 'final'} - ${a.elapsed.toFixed(1)}s`)));
    if (a.description) kids.push(el('div', { class: 'muted' }, a.description));
    if (a.goal) kids.push(el('div', {}, 'Goal: ' + a.goal));
    kids.push(el('div', { class: 'chips' }, ...a.parts.map(p => el('span', {}, el('span', { class: 'sw', style: `background:${p.color || '#888'}` }), ' ', p.name + (p.glyph ? ` (${p.glyph})` : '')))));
    const order = a.robots.map((r, i) => [r, i]).sort((x, y) => (x[0].rank ?? 99) - (y[0].rank ?? 99) || y[0].progress - x[0].progress);
    const cards = el('div', { class: 'bots' });
    for (const [r, i] of order) {
      const hist = el('ul', { class: 'hist' }, ...r.history.map(h => el('li', { class: h.includes('WRONG') ? 'wrong' : '' }, h)));
      const stats = a.has_target ? `${r.correct}/${r.needed} correct, ${r.wrong} wrong now, ${r.mistakes} mistakes, ${r.actions} actions`
                                 : `${(r.progress * 100).toFixed(0)}% progress, ${r.actions} actions`;
      cards.append(el('div', { class: 'bot' + (r.rank === 0 && !a.running ? ' win' : '') },
        el('h3', {}, el('span', { class: 'sw', style: `background:${ROBOT[r.color % 8]}` }), r.name,
          r.rank != null ? el('span', { class: 'muted' }, r.rank === 0 ? ' 1st' : ` #${r.rank + 1}`) : null),
        r.profile ? el('div', { class: 'muted' }, r.profile) : null,
        r.owner ? el('div', { class: 'muted' }, 'trained by ' + r.owner) : null,
        el('div', { class: 'meter' }, el('i', { style: `width:${(r.progress * 100).toFixed(1)}%` })),
        el('div', {}, 'Trying to: ', el('span', { class: 'intent' }, r.intent || '-')),
        r.carrying ? el('div', { class: 'muted' }, 'carrying ' + r.carrying) : null,
        el('div', { class: 'muted' }, stats + (r.finished_at != null ? `, done at ${r.finished_at.toFixed(1)}s` : '')),
        r.score != null ? el('div', {}, `Score ${r.score.toFixed(1)}`, el('span', { class: 'muted' }, r.score_note ? ' - ' + r.score_note : '')) : null,
        r.metrics.length ? el('div', { class: 'muted' }, r.metrics.map(m => `${m[0]}: ${m[1]}`).join(', ')) : null,
        r.submissions.length ? el('pre', { class: 'screen' }, r.submissions[0]) : null,
        hist));
    }
    kids.push(cards);
    box.replaceChildren(...kids);
  }

  let lastTick = 0;
  function refresh(force) {
    const now = performance.now();
    if (!force && now - lastTick < 250) return;
    lastTick = now;
    const len = ex.lab_panel();
    const d = JSON.parse(dec.decode(new Uint8Array(ex.memory.buffer, ex.lab_panel_ptr(), len)));
    selected = d.selected ? d.selected.id : '';
    renderRoster(d); renderAgent(d.selected); renderArena(d.arena);
  }
  $('filter').addEventListener('input', () => refresh(true));
  setInterval(() => refresh(false), 300);
})().catch(err => { document.getElementById('mode').textContent = 'Failed to start: ' + err; });
</script>
